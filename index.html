<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121018">
<title>Gold Coast Mystery Diner Form</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: the paper form reborn as a phone form. One section on screen at a time under a sticky black brand band with a scrolling section strip; photo slots sit where the paper form asked for photos; Back / Next at the foot of each section; every answer and photo autosaves to the phone. */
:root{
  --bg:#FBF9F5; --fg:#121018; --red:#C0392B; --muted:#6B655C; --line:#CDC5B6; --faint:#9A9284;
  --field:#FFFFFF; --band:#121018; --band-fg:#FBF9F5; --card:rgba(18,16,24,.03);
  --display:"Bebas Neue","Arial Narrow",Impact,"Helvetica Neue",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15131A; --fg:#F2EEE6; --red:#E25B4E; --muted:#ABA398; --line:#413C49; --faint:#7C7572; --field:#1F1C26; --band:#0B0A0E; --band-fg:#F2EEE6; --card:rgba(242,238,230,.04); color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#15131A; --fg:#F2EEE6; --red:#E25B4E; --muted:#ABA398; --line:#413C49; --faint:#7C7572; --field:#1F1C26; --band:#0B0A0E; --band-fg:#F2EEE6; --card:rgba(242,238,230,.04); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--band-fg)}
.top .in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.05em;line-height:1;white-space:nowrap}
.sub{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:right;line-height:1.2}
.sub b{color:var(--red);font-family:var(--display);font-size:15px;letter-spacing:.08em}
.dn{border:1.5px solid var(--red);border-radius:6px;padding:12px 14px 10px;margin:0 0 22px}
.dn b{display:block;font-family:var(--display);font-size:36px;color:var(--red);letter-spacing:.06em;line-height:1;margin:4px 0 8px}
.dn .note{margin:0;font-weight:700;color:var(--fg)}
.gate .note{font-size:16px;color:var(--fg)}
[hidden]{display:none!important}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2px 10px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:var(--display);font-size:15px;letter-spacing:.06em;padding:8px 12px 7px;border:1px solid color-mix(in srgb,var(--band-fg) 35%,transparent);border-radius:999px;background:transparent;color:var(--band-fg);line-height:1;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--band-fg);border-color:var(--band-fg);color:var(--band)}
.tab .dot{display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--band)}
.tab.has .dot{display:block}
.prog{height:3px;background:color-mix(in srgb,var(--band-fg) 15%,transparent)}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.st{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:center;padding:6px max(16px,env(safe-area-inset-left,0px)) 7px;line-height:1.3}
.st.bad{background:var(--red);color:var(--bg);font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;padding-block:9px}
.dn .note+.note{margin-top:8px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:680px;margin:0 auto}
section[hidden]{display:none}
.h1{font-family:var(--display);font-size:36px;line-height:.95;letter-spacing:.02em;margin:0;font-weight:400;text-wrap:balance}
.h1 b{color:var(--red);font-weight:400;margin-right:8px}
.lead{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.rule{height:2px;background:var(--fg);margin:10px 0 22px}
.g{margin:0 0 28px}
.gh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--fg);padding-bottom:5px;margin-bottom:14px}
.gh h2{font-family:var(--display);font-size:22px;letter-spacing:.03em;margin:0;line-height:1;font-weight:400}
.gh h2 b{color:var(--red);font-weight:400}
.note-r{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;max-width:52%;line-height:1.25}
.note{font-size:15px;color:var(--muted);margin:0 0 14px;line-height:1.45}
.f{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;min-width:0}
.f>label,.lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f>label.q,.lab.q{font-size:16px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg);line-height:1.35}
.hint{font-size:13px;color:var(--muted);min-height:1em}
input[type=text],input[type=date],input[type=time],textarea{display:block;width:100%;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--fg);border-radius:4px;padding:11px 12px;min-height:46px;margin:0;line-height:1.3}
input[type=text],textarea{-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
textarea{min-height:88px;resize:none;overflow:hidden;line-height:1.4}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aff{display:flex;align-items:center;gap:8px}
.aff .pre,.aff .suf{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.aff input{flex:1 1 auto}
.qi{position:relative}
.qi::before{content:"\201C";position:absolute;left:11px;top:3px;font-family:var(--display);font-size:30px;color:var(--red);line-height:1;pointer-events:none}
.qi input{padding-left:32px}
.now{flex:0 0 auto;font-family:var(--display);font-size:15px;letter-spacing:.08em;padding:0 13px;min-height:46px;border:1.5px solid var(--red);color:var(--red);background:transparent;border-radius:4px;cursor:pointer;line-height:1}
.now:active{background:var(--red);color:var(--bg)}

.cks{display:grid;grid-template-columns:1fr;gap:0 24px;margin:0 0 14px}
@media (min-width:560px){.cks{grid-template-columns:1fr 1fr}}
.ck{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px;line-height:1.3;margin:0}
.ck input{-webkit-appearance:none;appearance:none;flex:0 0 auto;width:24px;height:24px;margin:0;border:1.5px solid var(--fg);border-radius:3px;background:var(--field);position:relative;cursor:pointer}
.ck input:checked{background:var(--red);border-color:var(--red)}
.ck input:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.yn{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.yn .q{flex:1 1 180px;font-size:16px;line-height:1.35}
.yn .chips{flex:0 0 auto}
.yn .chip{min-width:64px;justify-content:center}
.ynl{margin:0 0 14px}
.card .ynl{margin-bottom:6px}
.diag{font-size:11px;color:var(--faint);margin-top:16px;line-height:1.45}
.chip{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:2px 14px 0;border:1.5px solid var(--red);border-radius:4px;color:var(--red);font-family:var(--display);font-size:17px;letter-spacing:.05em;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1}
.chip input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.chip.on{background:var(--red);color:var(--bg)}

.rl{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--line);margin:0 0 10px}
.rl .q{flex:1 1 200px;font-size:16px;line-height:1.35}
.rate{display:grid;grid-template-columns:repeat(5,44px);gap:8px}
.rate label{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1.5px solid var(--fg);border-radius:50%;font-weight:700;font-size:15px;cursor:pointer;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;margin:0}
.rate input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.rate label.on{background:var(--fg);color:var(--bg)}

.card{border:1.5px solid var(--fg);border-radius:6px;padding:14px 14px 2px;margin:0 0 14px;background:var(--card);min-width:0}
.card .ct{font-family:var(--display);font-size:19px;letter-spacing:.04em;margin:0 0 10px;line-height:1}
.card .ck:last-of-type{border-bottom:0}
.rep[hidden]{display:none}

.mo{padding:10px 0;border-bottom:1px solid var(--line)}
.mo .ml{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:6px;gap:8px}
.mo .ml i{font-style:normal;font-size:11px;color:var(--faint);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.mo .mr{display:flex;gap:8px;align-items:center}
.mo .yn{border:0;padding:0}
.mo input[type=time]{flex:0 0 8.4em;width:8.4em}
.mo input[type=text]{flex:1 1 40px;min-width:0}

/* photo slots */
.ph{border:1.5px dashed var(--fg);border-radius:6px;padding:10px;background:var(--card)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:8px}
.thumbs.list{grid-template-columns:1fr}
.thumbs:empty{display:none}
.th{position:relative;border-radius:4px;overflow:hidden;background:var(--line)}
.th img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.th .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0}
.th.row{display:grid;grid-template-columns:96px 1fr;gap:8px;background:transparent;overflow:visible;align-items:center}
.th.row img{border-radius:4px}
.th.row .x{right:auto;left:62px}
.th.row .cap{margin:0}
.addph{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:1.5px solid var(--red);border-radius:4px;color:var(--red);font-family:var(--display);font-size:17px;letter-spacing:.06em;cursor:pointer;line-height:1;padding:2px 10px 0}
.addph input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.addph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;flex:0 0 auto;margin-top:-2px}
.addph[hidden]{display:none}
.busy{font-size:13px;color:var(--muted);margin-top:6px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal figure{margin:0;min-width:0}
.gal img{display:block;width:100%;border-radius:4px}
.gal figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.lnk{background:none;border:0;color:var(--red);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.lnk.inv{color:var(--bg)}

.rules{list-style:none;padding:0;margin:0 0 10px}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 0;font-size:16px;line-height:1.35;border-bottom:1px solid var(--line)}
.rules li b{font-family:var(--display);color:var(--red);font-size:21px;line-height:1;font-weight:400;padding-top:1px}
.recall{border-left:3px solid var(--red);padding:8px 12px;margin:0;font-style:italic;color:var(--muted);white-space:pre-wrap;line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:3px 20px 0;border-radius:4px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font-family:var(--display);font-size:19px;letter-spacing:.06em;cursor:pointer;text-decoration:none;line-height:1;text-align:center}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--bg)}
.btn.small{min-height:44px;font-size:16px;padding:2px 14px 0}
.btn[hidden]{display:none}
.btn:disabled{opacity:.55;cursor:default}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:16px;border-top:2px solid var(--fg)}
.nav .btn{flex:1 1 0;min-width:0}
.saved{text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:14px;min-height:1em}
.conf{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:12px;margin-top:28px}

.sendbox{border:2px solid var(--red);border-radius:6px;padding:16px;margin:0 0 24px}
.sendbox h3{font-family:var(--display);font-size:28px;color:var(--red);margin:0 0 8px;letter-spacing:.04em;font-weight:400;line-height:1}
.steps{margin:0 0 16px;padding-left:22px}
.steps li{margin:0 0 7px;line-height:1.4}
.addr{font-weight:700;word-break:break-all;user-select:all;-webkit-user-select:all}
.stack{display:flex;flex-direction:column;gap:10px}
.miss{margin:0 0 6px;padding:0;list-style:none}
.miss li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.miss li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.miss li.ok span:last-child{color:var(--red);font-weight:700}
.note.mt{margin-top:12px;margin-bottom:0}
details.alt{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
details.alt summary{cursor:pointer;font-weight:700;color:var(--red);font-size:15px;list-style:none;padding:6px 0}
details.alt summary::-webkit-details-marker{display:none}
details.alt summary::before{content:"+ "}
details.alt[open] summary::before{content:"\2013 "}
details.alt .stack{margin-top:10px}
#report{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;min-height:240px;max-height:60vh;overflow:auto;white-space:pre-wrap;line-height:1.35;resize:vertical}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:4px;font-size:14px;line-height:1.35;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<div class="top">
  <div class="in"><div class="brand">THIRD WAVE BBQ</div><div class="sub" id="sub">Mystery diner<br>Surfers Paradise</div></div>
  <div class="strip" role="tablist" id="strip"></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="st" id="st" hidden></div>
  <div class="st bad" id="st2" hidden></div>
</div>
<main id="main"></main>
<div id="lb" hidden><img alt="Photo, full size"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function repTitle(f,i){ return f.titles?f.titles[i]:f.title+" "+(i+1); }
function cardFields(f,i){ return f.fields.filter(function(sf){ return !(sf.not&&sf.not.indexOf(i)>=0); }); }

var SECTIONS=[
{id:"start",tab:"Start",title:"MYSTERY DINER REPORT",lead:"Gold Coast · Surfers Paradise · Confidential",groups:[
 {h:"HOW THIS",r:"WORKS",fields:[
  {t:"rules",items:RULES},

 ]},
 {h:"YOUR",r:"VISIT",fields:[

  {t:"num",id:"v_spend",label:"Total spend",pre:"$",mode:"decimal"},
  {t:"checks",items:[["v_receipt","Receipt kept"]]}
 ]},
 {h:"YOUR",r:"DETAILS",fields:[
  {t:"text",id:"d_name",label:"Name"},
  {t:"text",id:"d_contact",label:"Phone / email"}
 ]}
]},
{id:"online",tab:"01 Online",num:"01",title:"BEFORE YOU GO — ONLINE",groups:[
 {h:"WEBSITE",fields:[
  {t:"checks",items:[["o_w_search","Found it on the first search"],["o_w_hours","Opening hours easy to find"],["o_w_menu","Website easy to navigate"]]},
  {t:"area",id:"o_w_broken",label:"Anything out of date or broken:",q:1}
 ]},
 {h:"INSTAGRAM",fields:[
  {t:"rate",id:"o_ig_hungry",label:"The food photos make you hungry"},
  {t:"rate",id:"o_ig_pick",label:"Looks like a place you would pick yourself"}
 ]},
 {h:"IF YOU BOOKED",fields:[
  {t:"checks",items:[["o_b_fast","Done in under two minutes"],["o_b_conf","Confirmation arrived"],["o_b_details","Details right on arrival — name, party size"]]}
 ]}
]},
{id:"outside",tab:"02 Outside",num:"02",title:"OUTSIDE & ARRIVAL",groups:[
 {h:"THE SHOPFRONT",note:"Photos — shopfront · signage · entry",fields:[
  {t:"checks",items:[["x_sign","Signage clean and working"],["x_glass","Windows and glass clean"],["x_decals","Window decals intact, not peeling"],["x_path","Footpath swept — no butts, no grease"],["x_menu","Menu displayed and current"],["x_hours","Opening hours visible"],["x_lights","Outside lights all working"],["x_entry","Entry clear — no clutter or crates"],["x_bins","Bins out of sight"],["x_furn","Outdoor furniture straight and clean"]]},
  {t:"area",id:"x_faded",label:"Anything faded, broken or dirty:",q:1},
  {t:"photo",id:"ph_front",label:"Shopfront, straight on",max:2},

 ]},

/* ---------- state <-> DOM ---------- */
function restore(){
  $$("[data-id]").forEach(function(el){
    var v=S[el.dataset.id];
    if(el.type==="checkbox"){ el.checked=v===true; }
    else if(el.type==="radio"){ el.checked=(v!=null&&String(v)===el.value); el.closest("label").classList.toggle("on",el.checked); }
    else { el.value=v==null?"":v; }
  });
  $$(".rep").forEach(function(r){ var k=r.dataset.rep,i=+r.dataset.i; var has=$$("[data-id]",r).some(function(e){ var v=S[e.dataset.id]; return v===true||(typeof v==="string"&&v.trim()!==""); }); if(has) shown[k]=Math.max(shown[k],i+1); });
  restoreReps();
  $$("textarea").forEach(grow);
  dayHint();
}
function restoreReps(){
  $$(".rep").forEach(function(r){ r.hidden=(+r.dataset.i)>=shown[r.dataset.rep]; });
  $$("[data-add]").forEach(function(b){ b.hidden=shown[b.dataset.add]>=REPMAX[b.dataset.add]; });
}
function grow(el){ el.style.height="auto"; el.style.height=Math.max(88,el.scrollHeight+2)+"px"; }
function dayHint(){ var h=$("#h_v_date"); if(!h) return; var d=fmtDate(S.v_date,{weekday:"long"}); h.textContent=d?d:""; }
function refreshRecall(){ $$("[data-recall]").forEach(function(el){ var v=(S[el.dataset.recall]||"").trim(); el.textContent=v||"(you left this blank on the Online page)"; }); }

function stats(){
  var out=[];
  SECTIONS.forEach(function(s){
    if(s.send) return;
    var sec=$("#s_"+s.id), items={}, order=[];
    function mark(key,ans){ if(!(key in items)){ items[key]=false; order.push(key); } items[key]=items[key]||ans; }
    $$("[data-id]",sec).forEach(function(e){
      var rep=e.closest(".rep"); if(rep&&rep.hidden) return;
      var key=e.dataset.id;
      var v=S[e.dataset.id]; mark(key,v===true||(typeof v==="string"&&v.trim()!==""));
    });
    $$(".ph[data-slot]",sec).forEach(function(e){ var rep=e.closest(".rep"); if(rep&&rep.hidden) return; mark("ph:"+e.dataset.slot,(P[e.dataset.slot]||[]).length>0); });
    var a=0; order.forEach(function(k){ if(items[k]) a++; });
    out.push({id:s.id,tab:s.tab,title:s.title,a:a,n:order.length});
  });
  return out;
}
function refresh(){
  var st=stats(), A=0, N=0;
  st.forEach(function(x){ A+=x.a; N+=x.n; var t=$('.tab[data-go="'+x.id+'"]'); if(t) t.classList.toggle("has",x.a>0); });
  $("#prog").style.width=(N?Math.round(100*A/N):0)+"%";
}

function show(id,noSave){

  $$(".tab").forEach(function(t){ var on=t.dataset.go===id; t.setAttribute("aria-selected",on?"true":"false"); if(on){ try{ t.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} } });
  refreshRecall();
  if(id==="verdict") renderPcl();
  if(id==="send") buildSend();
  window.scrollTo(0,0);
  if(!noSave) persist();

/* ---------- report text ---------- */
function fmtDate(iso,opt){ if(!iso) return ""; var d=new Date(iso+"T12:00:00"); if(isNaN(d)) return iso; return d.toLocaleDateString("en-AU",opt||{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function lab(f){ return String(f.label||"").replace(/\s*:\s*$/,""); }
function sval(id){ var v=S[id]; return typeof v==="string"?v.trim():""; }
function repHas(f,bp){ var any=false; f.fields.forEach(function(sf){ if(sf.t==="checks"){ sf.items.forEach(function(it){ if(sval(bp+it[0])) any=true; }); } else if(sf.t==="photo"){ if((P[bp+sf.id]||[]).length) any=true; } else if(sval(bp+sf.id)) any=true; }); return any; }
function rep(f,pfx,L){
  var id=pfx+(f.id||""), v;
  switch(f.t){
    case "row": f.fields.forEach(function(x){ rep(x,pfx,L); }); break;
    case "text": L.push(lab(f)+": "+(sval(id)?(f.quote?"“"+sval(id)+"”":sval(id)):"—")); break;
    case "area": v=sval(id); if(v.indexOf("\n")<0){ L.push(lab(f)+": "+(v||"—")); } else { L.push(lab(f)+":"); v.split("\n").forEach(function(x){ L.push("    "+x); }); } break;
    case "date": L.push(lab(f)+": "+(fmtDate(sval(id))||"—")); break;
    case "time": L.push(lab(f)+": "+(sval(id)||"—")); break;
    case "num": v=sval(id); L.push(lab(f)+": "+(v?(f.pre||"")+v+(f.suf?" "+f.suf:""):"—")); break;
    case "checks": f.items.forEach(function(it){ L.push(it[1]+": "+(sval(pfx+it[0])||"—")); }); break;
    case "single": L.push((lab(f)||"Answer")+": "+(sval(id)||"—")); break;
    case "yn": L.push(lab(f)+": "+(sval(id)||"—")); break;
    case "rate": v=sval(id); L.push(lab(f)+": "+(v?v+"/"+(f.max||5):"—")); break;
    case "words3": v=[1,2,3].map(function(n){ return sval(id+n); }).filter(Boolean); L.push(lab(f)+": "+(v.length?v.join(", "):"—")); break;
    case "zones": f.items.forEach(function(z,i){ var b=f.id+i+"_"; L.push(z+": clean "+(sval(b+"clean")||"—")+"/5 · condition "+(sval(b+"cond")||"—")+"/5"+(sval(b+"note")?" · "+sval(b+"note"):"")); }); break;
    case "clock": f.items.forEach(function(it,i){ var b=f.id+i+"_"; if(it.yn){ L.push(it.m+": "+(sval(b+"y")||"—")); return; } var t=sval(b+"t")||" — "; while(t.length<6) t+=" "; L.push(t+" "+it.m+(sval(b+"n")?"  — "+sval(b+"n"):"")); }); break;
    case "photo": v=(P[id]||[]).length; L.push("Photos — "+slotLabel(id)+": "+(v?v+" in the PDF":"none")); break;
    case "repeat":
      for(var i=0;i<shown[f.id];i++){
        var b=f.id+i+"_"; if(!repHas(f,b)) continue;
        var sub=[]; cardFields(f,i).forEach(function(sf){ rep(sf,b,sub); });
        L.push(repTitle(f,i)+":"); sub.forEach(function(x){ L.push("    "+x); });
      }
      break;
  }
}
function report(){
  var L=[];
  L.push("THIRD WAVE BBQ — MYSTERY DINER REPORT");
  L.push("Gold Coast · Surfers Paradise");
  L.push("Diner number: "+CODE);
  L.push("Sent: "+new Date().toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}));
  L.push("Photos: "+photoCount()+" (in the attached PDF)");
  L.push(""); L.push("AT A GLANCE"); L.push(glanceText()); L.push("");
  SECTIONS.forEach(function(s){
    if(s.send) return;
    if(s.id!=="start"){ L.push("============================================"); L.push(s.num+"  "+s.title); L.push("============================================"); }
    s.groups.forEach(function(g){ if(g.fields.every(function(f){ return f.t==="pcl"||f.t==="rules"||f.t==="note"; })) return; L.push(""); L.push("-- "+g.h+(g.r?" "+g.r:"")+" --"); g.fields.forEach(function(f){ rep(f,"",L); }); });
    L.push("");
  });
  L.push("Sent from the Third Wave BBQ mystery diner form.");
  return L.join("\n");
}

function buildSend(){

/* ---------- PDF ---------- */
